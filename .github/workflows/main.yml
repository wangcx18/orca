name: Build Windows Orca

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop assets
        run: pnpm run build:desktop

      - name: Ensure Electron runtime
        run: pnpm run ensure:electron-runtime

      - name: Build Windows unpacked
        run: pnpm exec electron-builder --config config/electron-builder.config.cjs --win --dir

      - name: Show output files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 3 dist | Select-Object FullName, Length

      - name: Upload Windows unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-windows-unpacked
          path: dist/win-unpacked/**
          if-no-files-found: error
